<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | 個人作品集</title>
    <style>
        :root {
            --bg: #F7F4EF;
            --card: #EFECE6;
            --text: #4A453F;
            --muted: #8C857B;
            --line: #D9D2C7;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 680px;
            width: 100%;
        }
        header {
            margin-bottom: 50px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }
        p.subtitle {
            color: var(--muted);
            margin: 0;
            font-size: 0.95rem;
        }
        section {
            margin-bottom: 40px;
        }
        h2 {
            font-size: 1.1rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        .box {
            background-color: var(--card);
            padding: 24px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .box h3 {
            margin-top: 0;
            font-size: 1.1rem;
        }
        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 60px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>你的名字 (Your Name)</h1>
        <p class="subtitle">大一新生 / 學習者 / 建造大四專業作品集中</p>
    </header>

    <section>
        <h2>About</h2>
        <div class="box">
            <p>你好，我是目前就讀大學一年級的學生。這個網站是我的個人作品集雛型，將記錄我從大一至大四的技術成長與專案軌跡，目標是打造出讓業界驚艷的專業作品。</p>
        </div>
    </section>

    <section>
        <h2>Projects (Coming Soon)</h2>
        <div class="box">
            <h3>專案預告 01</h3>
            <p>大二、大三時期的核心代表作將放置於此。</p>
        </div>
        <div class="box">
            <h3>專案預告 02</h3>
            <p>持續累積實戰經驗中，敬請期待。</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Your Name. All rights reserved.</p>
    </footer>
</div>

</body>
</html>
